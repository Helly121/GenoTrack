name: "CI - Data Contract & Schema Integrity"

on:
  push:
    paths:
      - "crops/**"
      - "src/ingest/**"
      - "src/clean/**"
      - "src/features/**"
  pull_request:
    paths:
      - "crops/**"
      - "src/ingest/**"
      - "src/clean/**"

jobs:
  data-contract-check:
    name: "Pandera Schema & Dimensionality Validation"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          pip install -r requirements.txt

      - name: "Validate Ingestion & QC Data Contracts"
        run: |
          python -m pytest tests/test_adapter.py tests/test_features.py -v
