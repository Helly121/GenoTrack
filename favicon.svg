<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Seed Husk Gradients -->
    <linearGradient id="seedHusk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C166"/>
      <stop offset="45%" stop-color="#D99738"/>
      <stop offset="100%" stop-color="#9E611A"/>
    </linearGradient>
    <linearGradient id="seedInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D0"/>
      <stop offset="100%" stop-color="#E2B15D"/>
    </linearGradient>
    
    <!-- Fresh Leaf Gradients -->
    <linearGradient id="leafMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D7A22"/>
      <stop offset="60%" stop-color="#55B339"/>
      <stop offset="100%" stop-color="#8CE866"/>
    </linearGradient>
    <linearGradient id="leafSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#408E32"/>
      <stop offset="100%" stop-color="#9DF279"/>
    </linearGradient>

    <!-- Shadow for depth -->
    <filter id="seedShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#seedShadow)">
    <!-- ==================== SPROUTING LEAVES (Top) ==================== -->
    <!-- Primary Big Leaf (curves up-right) -->
    <path d="M 32 30 C 32 18, 41 8, 55 6 C 53 19, 44 28, 32 30 Z" 
          fill="url(#leafMain)" stroke="#1F5A17" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Leaf Center Vein -->
    <path d="M 34 26 Q 42 18 51 10" 
          stroke="#DCFFCC" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Secondary Leaf (curves up-left) -->
    <path d="M 30 28 C 26 19, 18 13, 9 12 C 12 23, 20 28, 30 28 Z" 
          fill="url(#leafSecondary)" stroke="#1F5A17" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Leaf 2 Vein -->
    <path d="M 28 26 Q 20 21 13 15" 
          stroke="#DCFFCC" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Sprout Stem / Hypocotyl connecting into seed -->
    <path d="M 32 36 L 32 26" 
          stroke="#68C746" stroke-width="3" stroke-linecap="round"/>

    <!-- ==================== PROMINENT SEED (Bottom) ==================== -->
    <!-- Main Seed Body - Unmistakable plump oval grain/seed shape -->
    <path d="M 32 28 C 43 31, 52 40, 49 51 C 46 60, 36 62, 32 62 C 28 62, 18 60, 15 51 C 12 40, 21 31, 32 28 Z" 
          fill="url(#seedHusk)" stroke="#6E3F0A" stroke-width="1.5"/>

    <!-- Seed Texture / Suture Crease (Classic grain characteristic) -->
    <path d="M 32 31 C 30 40, 30 50, 32 60" 
          stroke="#7A450D" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 33 32 C 31 41, 31 51, 33 59" 
          stroke="#FFE8B5" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- Left Husk Contour Highlight -->
    <path d="M 20 40 C 18 46, 21 53, 26 57" 
          stroke="#FFDF9E" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Seed Germ Point (Split coat where sprout pushes through) -->
    <path d="M 28 32 C 30 29, 34 29, 36 32 C 34 34, 30 34, 28 32 Z" 
          fill="#529938"/>
  </g>
</svg>
